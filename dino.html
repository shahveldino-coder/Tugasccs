<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Based On Modular Design</title>
<style>
  :root{
    --ink:#1e2233;
    --sub:#6b7280;
    --line:#e9e9ee;
    --bg:#ffffff;

    --pink:#e56f9e;
    --cyan:#2ec6d6;
    --green:#5fc39a;
    --indigo:#4b56c9;
    --mint:#7fceac;
    --tan:#cba088;
    --blue:#2f6fed;
    --purple:#8e3fd6;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:var(--bg);
  }

  .section{
    max-width:1100px;
    margin:0 auto;
    padding:72px 24px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  .heading{
    text-align:center;
    font-size:2.1rem;
    font-weight:700;
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }

  .subheading{
    text-align:center;
    font-size:1.15rem;
    font-weight:300;
    color:#4b5160;
    max-width:520px;
    margin:0 auto 64px;
    line-height:1.5;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    row-gap:56px;
    column-gap:24px;
  }

  .feature{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .icon{
    width:64px;
    height:64px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.25);
  }

  .icon svg{
    width:30px;
    height:30px;
    stroke:#fff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .label{
    font-size:1rem;
    font-weight:700;
    color:#232738;
  }

  @media (max-width: 800px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
    .heading{ font-size:1.6rem; }
  }
</style>
</head>
<body>

<section class="section">
  <h2 class="heading">Based On Modular Design</h2>
  <p class="subheading">Build awesome websites or landing pages with simple and independent parts.</p>

  <div class="grid">

    <div class="feature">
      <div class="icon" style="background:var(--pink)">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 9h6M9 12h4"/><circle cx="4" cy="4" r="0.6" fill="#fff"/><circle cx="20" cy="4" r="0.6" fill="#fff"/><circle cx="4" cy="20" r="0.6" fill="#fff"/><circle cx="20" cy="20" r="0.6" fill="#fff"/></svg>
      </div>
      <div class="label">Minimal Design</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--cyan)">
        <svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19a1 1 0 1 0 0.001 0"/></svg>
      </div>
      <div class="label">Rocket Fast</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--green)">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M9 10v9"/></svg>
      </div>
      <div class="label">Custom Framework</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--indigo)">
        <svg viewBox="0 0 24 24"><path d="M5 4h11a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V4z"/><path d="M9 9h5M9 12h5"/></svg>
      </div>
      <div class="label">Style Guide</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--mint)">
        <svg viewBox="0 0 24 24"><path d="M9 6 3 12l6 6"/><path d="M15 6l6 6-6 6"/></svg>
      </div>
      <div class="label">CSS + SASS</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--tan)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </div>
      <div class="label">100% Customizable</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--blue)">
        <svg viewBox="0 0 24 24" stroke="none"><rect x="4" y="4" width="7" height="7" rx="1" fill="#fff"/><rect x="13" y="4" width="7" height="7" rx="1" fill="#fff" opacity="0.55"/><rect x="4" y="13" width="7" height="7" rx="1" fill="#fff" opacity="0.55"/><rect x="13" y="13" width="7" height="7" rx="1" fill="#fff"/></svg>
      </div>
      <div class="label">Modular Design</div>
    </div>

    <div class="feature">
      <div class="icon" style="background:var(--purple)">
        <svg viewBox="0 0 24 24" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="label">HTML5 Valid</div>
    </div>

  </div>
</section>

</body>
</html>
